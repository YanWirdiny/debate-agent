[project]
name = "debate-agent-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "httpx>=0.27,<1", "deepgram-sdk>=3,<6",
  "sentence-transformers>=3,<6", "numpy>=2,<3", "motor>=3.6,<4",
  "openai>=1.50,<3", "google-genai>=1,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
